# Added by Task 15 from the templates found inside refs on the public corpus and the private (Ruwiki)
# corpus. All of them occur on ru.wikipedia, so none is limited to a site. An alias shares its entry because
# the corpus uses it the same way (same parameters, same place in the ref); otherwise a name has its own
# entry. Templates that identify a source are citations; those that only format text inside a ref are
# `other`.

[[template]]
name = "cite web 2"
aliases = []
