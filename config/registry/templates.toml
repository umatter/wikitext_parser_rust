# Short citations written inside a ref ({{harvnb|Иванов|1990|p=5}}; {{sfn0}} is {{sfn}} without its own
# ref). They point to a bibliography entry, as {{sfn}} does, but make no footnote and are not a source
# themselves, so they are `other`; the harv fields are kept for the CITEREF rules.
[[template]]
name = "harvnb"
aliases = ["sfn0"]
role = "other"
family = "short"
[template.fields]
harv_names = ["1", "2", "3", "4"]
harv_ref = ["ref"]

