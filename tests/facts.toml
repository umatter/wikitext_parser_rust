# Facts read from the markup (Task 19, Ruling R59). Each [[fact]] is one page version of the public corpus
# (tests/corpus/wikipedia_v1.parquet, Russian Wikipedia, CC BY-SA 4.0; see tests/corpus/ATTRIBUTION.md).
#
# Counted from a plain dump of the `wikitext` column by reading every <ref>, footnote template, citation
# template and heading of the version, helped only by regular-expression and brace-matching listings of the
# raw markup (never by this library or its output). Absent keys are not checked. The keys, in the terms of the
# output tables (tests/facts.rs computes the same from a parse):
#   refs_inline, refs_named, refs_reuse, refs_list_defined, refs_template
#                          <ref> tags and footnote templates ({{sfn}}, {{efn}}, ...) by kind, as SCHEMA defines
#                          the kinds: unnamed ref = inline, named with a body = named, named without = reuse,
#                          inside a <references> or ref-list template = list_defined, footnote template = template
#   ref_lists              <references> tags and ref-list templates ({{примечания}}, {{reflist}}, ...)
#   citations_by_family    citation rows by family: each citation template in a ref body or outside refs
#                          (not one nested in another's parameter; archive wrappers merge into the row before
#                          them), each bracketed external link in a ref body outside citation templates
#                          (bare_link), and one plain_text row for a ref body with neither; reuses and {{sfn}}
#                          have no rows
#   hosts                  the distinct hosts of those rows' URLs, sorted (lowercase, no leading "www.", the
#                          original of an archive URL)
#   reuse_targets          the name of every reuse whose definition is on the page, sorted, one per reuse
#   reuses_unresolved      reuses without a definition on the page
#   sfn_keys               the CITEREF key of every {{sfn}} whose target is on the page, sorted, one per use
#                          (the target's key is ref= plus the year, as the plan's CITEREF rules read it)
#   sfn_unresolved         {{sfn}} calls whose target is not on the page
#   sections               heading titles after the lead, in document order, as displayed
#   archived_originals     the original URL of every citation row with an archive link, sorted, one per row

